[project]
name = "photoclean"
version = "0.1.0"
description = "Local similar-photo cleaner powered by DINOv2 and LPIPS"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0",
  "PySide6>=6.7",
  "lpips>=0.1.4",
  "pillow-heif>=0.18",
  "pywin32>=306; sys_platform == 'win32'",
  "send2trash>=1.8",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.10"]

[project.scripts]
photoclean = "photoclean.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["photoclean*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
